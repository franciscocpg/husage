version: 2

project_name: husage

builds:
  - id: husage
    main: .
    binary: husage
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

release:
  prerelease: auto

homebrew_casks:
  - name: husage
    binaries:
      - husage
    homepage: "https://github.com/franciscocpg/husage"
    description: "Terminal dashboard for coding subscription usage"
    skip_upload: auto
    repository:
      owner: franciscocpg
      name: husage
      branch: main
    directory: Casks
    caveats: "Install the native Claude, Codex, or Cursor CLI for the accounts you want to monitor."
    # Use the declarative Homebrew hook until GoReleaser supports install_steps.
    # https://github.com/goreleaser/goreleaser/pull/6873
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/husage"]
        end
      end
